<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Меню кафе</title>

        body {

            background-color: #f5f0e8;

        }
        h1 {
            color: #8b4513;
        }
        h2 {
            color: #a0522d;
        }

            border-collapse: collapse;
            margin-top: 12px;
        }
        td {

            padding: 8px 16px;

    <table>
        <tr class="shapka"><td>Напиток</td><td>Цена</td></tr>
